<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Deriv Market Analyzer</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #111827;
      color: white;
      text-align: center;
      padding: 30px 15px;
    }

    h1 {
      margin-bottom: 10px;
    }

    .box {
      max-width: 500px;
      margin: 30px auto;
      padding: 25px;
      background: #1f2937;
      border-radius: 15px;
    }

    .price {
      font-size: 42px;
      font-weight: bold;
      margin: 20px 0;
    }

    .status {
      font-size: 16px;
      margin-bottom: 20px;
    }

    .market {
      font-size: 20px;
      color: #9ca3af;
    }
  </style>
</head>

<body>

  <h1>Deriv Market Analyzer</h1>

  <div class="box">

    <div class="market">
      Volatility 50 Index
    </div>

    <div class="status" id="status">
      Connecting to Deriv...
    </div>

    <div class="price" id="price">
      --
    </div>
<div>
      Live Market Price
    </div>

<div>
  20-Tick Average: <span id="average">Waiting...</span>
</div>

<div>
  Market Direction: <span id="direction">Waiting...</span>
</div>
<div>
  Momentum: <span id="momentum">Waiting...</span>
</div>
<div>
  Trading Signal: <span id="signal">Waiting...</span>
</div>

</div>

<script>
    

  // Connect to Deriv's public market-data WebSocket
  const ws = new WebSocket(
    "wss://api.derivws.com/trading/v1/options/ws/public"
  );

  const status = document.getElementById("status");
  const price = document.getElementById("price");
const average = document.getElementById("average");
const direction = document.getElementById("direction");
const momentumDisplay = document.getElementById("momentum");
const signal = document.getElementById("signal");
  // Store recent market prices
  const prices = [];
  const MAX_PRICES = 20;
const MOMENTUM_TICKS = 5;
  ws.onopen = function () {

    status.textContent = "Connected ✅";

    // Request Volatility 50 Index ticks
    ws.send(JSON.stringify({
      ticks: "1HZ50V",
      subscribe: 1
    }));

  };

    ws.onmessage = function (event) {

    const data = JSON.parse(event.data);

    if (data.tick) {

      const currentPrice = Number(data.tick.quote);

      price.textContent = currentPrice;

      prices.push(currentPrice);

      if (prices.length > MAX_PRICES) {
        prices.shift();
      }

      if (prices.length >= MAX_PRICES) {

        const total = prices.reduce(
          (sum, value) => sum + value,
          0
        );

        const movingAverage = total / MAX_PRICES;

        average.textContent = movingAverage.toFixed(2);
        const momentumPrice =
  prices[prices.length - 1 - MOMENTUM_TICKS];

let momentum;
momentumDisplay.textContent = momentum;
if (currentPrice > momentumPrice) {
  momentum = "UP 📈";
} else if (currentPrice < momentumPrice) {
  momentum = "DOWN 📉";
} else {
  momentum = "NEUTRAL ⏸️";
}
momentumDisplay.textContent = momentum;
        if (currentPrice > movingAverage) {

          direction.textContent = "Above Average 📈";

        } else if (currentPrice < movingAverage) {

          direction.textContent = "Below Average 📉";

        } else {

          direction.textContent = "At Average ⏸️";

        }

        if (currentPrice > movingAverage) {

          signal.textContent = "BUY 🟢";

        } else if (currentPrice < movingAverage) {

          signal.textContent = "SELL 🔴";

        } else {

          signal.textContent = "WAIT 🟡";

        }

      }

      status.textContent = "Live data received 🟢";

    }

  };

  ws.onerror = function () {

    status.textContent = "Connection error ❌";

  };

  ws.onclose = function () {

    status.textContent = "Disconnected 🔴";

  };

</script>
</body>
</html>
